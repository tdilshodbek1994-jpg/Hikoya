<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sado — statistika</title>
<style>
  :root { --bg:#f5f6fb; --card:#fff; --text:#141526; --muted:#6b7086; --line:#e6e8f0; --p:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1020; --card:#1a1b2e; --text:#f1f2fa; --muted:#9a9db5; --line:#2a2c44; --p:#a5b4fc; } }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); padding:16px; max-width:640px; margin:0 auto; }
  h1 { font-size:22px; margin:4px 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .k { background:var(--card); border-radius:16px; padding:14px; box-shadow:0 4px 16px rgba(0,0,0,.06); }
  .k b { display:block; font-size:26px; } .k span { color:var(--muted); font-size:13px; }
  h2 { font-size:15px; margin:18px 2px 8px; }
  .card { background:var(--card); border-radius:16px; padding:12px 14px; box-shadow:0 4px 16px rgba(0,0,0,.06); }
  .row { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; } .row:last-child { border:0; }
  .bars { display:flex; gap:8px; align-items:flex-end; height:110px; }
  .bar { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--muted); }
  .bar i { width:100%; background:var(--p); border-radius:6px 6px 2px 2px; min-height:3px; }
  .err { color:#e11d48; }
  .bars.hours { gap: 2px; } .bars.hours .bar { font-size: 9px; }
</style>
</head>
<body>
<h1>📊 Sado — statistika</h1>
<div id="out">Yuklanmoqda...</div>
<script>
const key = new URLSearchParams(location.search).get("key") || "";
const out = document.getElementById("out");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const MODES = { free: "💬 Erkin suhbat", live: "📞 Jonli suhbat", tutor: "🇺🇿 Ustoz", chat: "🇬🇧 Inglizcha suhbat" };
function load() {
fetch("api/admin/stats", { headers: { "X-Admin-Key": key } })
  .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
  .then(({ ok, d }) => {
    if (!ok) return (out.innerHTML = `<p class="err">${esc(d.error || "Xato")}. Manzil oxiriga ?key=ADMIN_KEY qo'shing.</p>`);
    const max = Math.max(1, ...d.byDay.map((x) => x[1]));
    out.innerHTML = `
      <div class="grid">
        <div class="k"><b>${d.users}</b><span>jami o'quvchi</span></div>
        <div class="k"><b>${d.activeToday}</b><span>bugun faol</span></div>
        <div class="k"><b>${d.activeWeek}</b><span>7 kunda faol</span></div>
        <div class="k"><b>${d.liveNow}</b><span>hozir darsda · bugun ${d.startsToday} boshlandi</span></div>
        <div class="k"><b>${d.lessons}</b><span>jami darslar (bugun ${d.lessonsToday})</span></div>
        <div class="k"><b>${d.avgScore}</b><span>o'rtacha ball · jami ${d.minutes || "<1"} daqiqa mashq</span></div>
        <div class="k"><b>${d.newToday ?? 0}</b><span>bugun yangi qo'shilgan</span></div>
        <div class="k"><b>${d.returning ?? 0}</b><span>2+ kun qaytgan${d.users ? ` (${Math.round(((d.returning ?? 0) / d.users) * 100)}%)` : ""}</span></div>
      </div>
      <p style="color:var(--muted);font-size:13px;margin:10px 2px 0">🔔 Kechki eslatma: ${d.reminders?.enabled ? `yoqilgan · ${d.remindOn} o'quvchi obuna · server ishga tushgandan beri ${d.reminders.sent} ta yuborildi${d.reminders.off ? `, ${d.reminders.off} tasi botni bloklagan` : ""}` : "serverda o'chiq (.env: REMINDERS=1)"}</p>
      <p style="color:var(--muted);font-size:13px;margin:10px 2px 0">📝 Namunaviy javoblar: ${d.samples?.ready ?? 0} ta tayyor (diskda) · server ishga tushgandan beri ${d.samples?.opens ?? 0} marta ochildi, AI ${d.samples?.generated ?? 0} marta chaqirildi</p>
      <p style="color:var(--muted);font-size:13px;margin:10px 2px 0">💾 Ovoz keshi: ${d.ttsCache.hits} marta qayta ishlatildi (tejaldi), ${d.ttsCache.misses} marta yangi yaratildi</p>
      ${["uz", "en"].filter((k) => d.ttsCache[k]?.n).map((k) => { const t = d.ttsCache[k]; return `<p style="color:var(--muted);font-size:13px;margin:4px 2px 0">🔊 ${k === "uz" ? "O'zbekcha" : "Inglizcha"} ovoz: ${t.n} ta · o'rtacha ${(t.ms / t.n / 1000).toFixed(1)} s · xato ${t.err} · ${Object.entries(t.via).map(([v, n]) => `${esc(v)} ${n}`).join(", ")}</p>`; }).join("")}
      ${d.free ? `<div class="card" style="margin-top:12px"><b>💬 Erkin suhbat (server ishga tushgandan beri)</b>
        <p style="font-size:13px;margin:6px 0">Javoblar: ${d.free.turns} · ⏱ o'rtacha AI javobi: <b>${(d.free.avgMs / 1000).toFixed(1)} s</b> · eng uzoq: ${(d.free.maxMs / 1000).toFixed(1)} s · 🐢 7 s dan uzoq: <b>${d.free.slow}</b> · ⚠️ xato: <b>${d.free.errors}</b></p>
        ${d.free.recent?.length ? `<p style="font-size:12px;margin:6px 0;color:var(--muted)">Oxirgi javoblar (s): ${d.free.recent.map((ms) => (ms / 1000).toFixed(1)).join(" · ")}</p>` : ""}</div>` : ""}
      ${d.live && d.liveEnabled !== false ? `<div class="card" style="margin-top:12px"><b>📞 Jonli suhbatlar (server ishga tushgandan beri)</b>
        <p style="font-size:13px;margin:6px 0">Boshlangan: ${d.live.calls} · Gemini ulandi: ${d.live.ready} · 🤫 Sado javobsiz qolib tugagan: <b>${d.live.noReply}</b> · jimlikda yordam: ${d.live.nudges}</p>
        <p style="font-size:13px;margin:6px 0">Qanday tugadi: ${Object.entries(d.live.ends).map(([k, v]) => `${esc(k)} — ${v}`).join(" · ") || "—"}</p>
        <table style="width:100%;font-size:12px;border-collapse:collapse">${d.live.recent.map((r) => `<tr style="vertical-align:top"><td style="white-space:nowrap;padding-right:6px">${esc(r.at.slice(6))}</td><td style="white-space:nowrap;padding-right:6px">${r.sec} s</td><td>${r.ready ? "✅" : "❌ ulanmadi"}</td><td style="white-space:nowrap;padding-right:6px">${r.turns} nav.</td><td>${r.noReply ? "🤫 javobsiz" : ""}</td><td>${esc(r.reason)}${r.dev ? ` · ${esc(r.dev)}` : ""}${r.paused ? ` · ⏸${r.paused}` : ""}</td></tr>`).join("")}</table></div>` : ""}
      <p style="color:var(--muted);font-size:13px;margin:10px 2px 0">✨ Imkoniyatlar (server ishga tushgandan beri): 💡 yordam ${d.features?.hint ?? 0} · 🇺🇿 tarjima ${d.features?.translate ?? 0} · 🔀 mavzu almashtirish ${d.features?.topic ?? 0}</p>
      <h2>📅 Oxirgi 7 kun (darslar)</h2>
      <div class="card"><div class="bars">${d.byDay.map(([k, n]) => `<div class="bar">${n}<i style="height:${(n / max) * 80}px"></i>${k.slice(5)}</div>`).join("")}</div></div>
      <h2>🕐 Qaysi soatlarda mashq qilishadi (Toshkent)</h2>
      <div class="card"><div class="bars hours">${(() => { const hm = Math.max(1, ...(d.byHour || [])); return (d.byHour || []).map((n, h) => `<div class="bar" title="${h}:00 — ${n} ta dars">${n || ""}<i style="height:${(n / hm) * 60}px"></i>${h % 3 === 0 ? h : ""}</div>`).join(""); })()}</div>
      <p style="color:var(--muted);font-size:12px;margin:6px 0 0">${(() => { const h = d.byHour || []; const top = h.indexOf(Math.max(...h)); return Math.max(...h) ? `Eng faol soat: ${top}:00–${top + 1}:00. Eslatmani shu paytdan sal oldinroqqa qo'yish foydali.` : ""; })()}</p></div>
      <h2>🎛 Rejimlar</h2>
      <div class="card">${(d.byMode || []).map((m) => `<div class="row"><span>${esc(MODES[m.mode] || m.mode)} <small style="color:var(--muted)">· o'rtacha ${m.avg} ball</small></span><b>${m.n}</b></div>`).join("") || "<p>Hali dars yo'q</p>"}</div>
      <h2>✏️ Eng ko'p uchraydigan xatolar</h2>
      <div class="card">${(d.mistakes || []).map((m) => `<div class="row"><span><s style="color:#e11d48">${esc(m.wrong)}</s> → <b style="color:#16a34a">${esc(m.right)}</b><br><small style="color:var(--muted)">${esc(m.why)}</small></span><b>${m.n}</b></div>`).join("") || "<p>Hali xato yo'q</p>"}</div>
      <h2>🔥 Eng mashhur mavzular</h2>
      <div class="card">${d.top.map((t) => `<div class="row"><span>${esc(t.emoji)} ${esc(t.title)}</span><b>${t.n}</b></div>`).join("") || "<p>Hali dars yo'q</p>"}</div>
      <p style="color:var(--muted);font-size:12px;text-align:center;margin-top:14px">🔄 Har 60 soniyada avtomatik yangilanadi · oxirgi: ${new Date().toLocaleTimeString("uz-UZ", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}</p>`;
  })
  .catch(() => (out.innerHTML = '<p class="err">Server bilan aloqa yo\'q</p>'));
}
load();
setInterval(() => { if (!document.hidden) load(); }, 60000);
</script>
</body>
</html>
