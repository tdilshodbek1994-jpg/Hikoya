# Mavjud domeningizning server { ... } bloki ICHIGA qo'shing (HTTPS bo'lgan blokka).
# Shundan keyin ilova https://SIZNING-DOMEN.uz/speaking/ manzilida ochiladi.

location = /speaking {
    return 301 /speaking/;
}

location /speaking/ {
    proxy_pass http://127.0.0.1:3000/;   # oxiridagi "/" prefiksni olib tashlaydi
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 📞 Jonli suhbat (WebSocket) uchun — bularsiz ulanish uziladi yoki umuman ochilmaydi
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 900s;             # 10 daqiqalik suhbat jim paytlarda uzilmasin
    proxy_send_timeout 900s;
    client_max_body_size 10m;            # ovozli xabarlar uchun
}
