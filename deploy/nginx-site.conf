# Site-only nginx config for a SHARED server (other projects keep their own files).
# It adds only DOMAIN; it does not touch default_server or other sites.
# Install:
#   sed -e "s/DOMAIN/your.domain/g" -e "s/WEBPORT/8080/g" deploy/nginx-site.conf > /etc/nginx/sites-available/hikoya
#   ln -s /etc/nginx/sites-available/hikoya /etc/nginx/sites-enabled/hikoya
#   nginx -t && systemctl reload nginx && certbot --nginx -d your.domain
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:WEBPORT;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
