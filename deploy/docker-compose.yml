# HIKOYA PRO — production-like stack. Usage (from repo root):
#   cp deploy/.env.example deploy/.env   # fill in values
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: hikoya

x-backend: &backend
  build: ../backend
  image: hikoya-backend:latest
  env_file: .env
  environment:
    HIKOYA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    HIKOYA_STORAGE_LOCAL_DIR: /app/var/storage
  volumes:
    - storage:/app/var/storage
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Continuous WAL archiving (RPO <= WAL_ARCHIVE_TIMEOUT, default 300 s): every finished WAL
    # segment is gzip-copied to the "walarchive" volume. Base backups: deploy/basebackup.sh.
    # Point-in-time restore: docs/BACKUP.md. Idle periods do not create new segments.
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /wal && chown postgres:postgres /wal &&
        exec docker-entrypoint.sh postgres
        -c wal_level=replica
        -c archive_mode=on
        -c archive_timeout=${WAL_ARCHIVE_TIMEOUT:-300}
        -c "archive_command=test ! -f /wal/%f.gz && gzip -c %p > /wal/%f.gz.tmp && mv /wal/%f.gz.tmp /wal/%f.gz"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/wal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: sh -c "alembic upgrade head && python -m app.cli seed"
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      retries: 5

  worker:
    <<: *backend
    command: python -m app.workers
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ../frontend/miniapp
    image: hikoya-web:latest
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"   # only the host reverse proxy (nginx/caddy) can reach it
    restart: unless-stopped

  # Optional: automatic HTTPS for your domain (Telegram requires HTTPS for Mini Apps and webhooks).
  # Enable with: --profile https   (needs DOMAIN and ports 80/443 free)
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

  # Optional antivirus for uploads (clamd INSTREAM). Enable with --profile antivirus and set
  # HIKOYA_CLAMAV_HOST=clamav in .env. Needs ~1.2 GB RAM for signatures.
  clamav:
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    volumes:
      - clamdb:/var/lib/clamav
    restart: unless-stopped

  # Optional: long-polling bot for servers without a public HTTPS webhook. Enable with --profile polling
  bot:
    <<: *backend
    command: python -m app.bot polling
    profiles: ["polling"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  walarchive:
  storage:
  caddy_data:
  clamdb:
